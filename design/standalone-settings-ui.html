<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>备用地址 · 独立设置页设计</title><style>
:root{color-scheme:dark;--dsw-alias-bg-base:#2c2c2e;--dsw-alias-bg-layer-1:#353638;--dsw-alias-bg-layer-2:#232324;--dsw-alias-border-l1:#ffffff24;--dsw-alias-border-l2:#ffffff33;--dsw-alias-label-primary:#f9fafb;--dsw-alias-label-secondary:#adb2b8;--dsw-alias-brand-primary:#7aaaff;--dsw-alias-state-error-primary:#f25a5a;--dsw-alias-state-success-primary:#5cce92}
*{box-sizing:border-box}body{margin:0;background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.4}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--dsw-alias-brand-primary);outline-offset:3px}.shell{display:grid;grid-template-columns:180px minmax(0,1fr);max-width:1100px;margin:40px auto;min-height:620px;border:1px solid var(--dsw-alias-border-l1);border-radius:20px;overflow:hidden}.nav{padding:26px 12px;border-right:1px solid var(--dsw-alias-border-l1);background:#28282a}.nav h2{font-size:16px;font-weight:500;margin:0 14px 26px}.nav div{padding:9px 14px;color:var(--dsw-alias-label-secondary);border-radius:10px;margin:3px 0}.nav .selected{background:var(--dsw-alias-bg-layer-1);color:var(--dsw-alias-label-primary)}main{padding:32px 40px;min-width:0;container-type:inline-size}h1{font-size:18px;font-weight:500;margin:0 0 24px}.field{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:18px}.label{color:var(--dsw-alias-label-secondary);font-size:13px}.select,input{width:100%;min-width:0;border:1px solid var(--dsw-alias-border-l1);border-radius:12px;background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-label-primary);padding:10px 12px}.primary{color:var(--dsw-alias-label-secondary);overflow-wrap:anywhere;font-size:13px}.block{margin-top:26px;border-top:1px solid var(--dsw-alias-border-l1);padding-top:22px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.head h2{font-size:14px;font-weight:500;margin:0}.toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dsw-alias-label-secondary);cursor:pointer}.toggle input{position:absolute;opacity:0;width:1px;height:1px}.track{width:34px;height:20px;border-radius:20px;background:#ffffff26;border:1px solid var(--dsw-alias-border-l1);position:relative}.track:after{content:"";position:absolute;width:14px;height:14px;top:2px;left:2px;border-radius:50%;background:#fff;transition:transform .15s}.toggle input:checked+.track{background:var(--dsw-alias-brand-primary)}.toggle input:checked+.track:after{transform:translateX(14px)}.toggle input:focus-visible+.track{outline:2px solid var(--dsw-alias-brand-primary);outline-offset:3px}.row{display:grid;grid-template-columns:20px minmax(0,1fr) 96px;gap:10px;align-items:start;margin-bottom:12px}.number{padding-top:10px;color:var(--dsw-alias-label-secondary);font-size:12px}.actions{display:flex;gap:2px;padding-top:6px}.icon{border:0;background:transparent;color:var(--dsw-alias-label-secondary);border-radius:8px;width:30px;height:30px}.icon:hover,.text:hover{background:#ffffff0d;color:var(--dsw-alias-label-primary)}.error{margin:5px 2px 0;color:var(--dsw-alias-state-error-primary);font-size:12px}.invalid{border-color:var(--dsw-alias-state-error-primary)}.text{border:0;background:none;color:var(--dsw-alias-label-secondary);border-radius:8px;padding:6px 12px}.add{margin-left:20px}.empty{color:var(--dsw-alias-label-secondary);padding:12px 0 20px;font-size:13px}.footer{display:flex;align-items:center;gap:10px;border-top:1px solid var(--dsw-alias-border-l1);margin-top:28px;padding-top:20px}.status{flex:1;color:var(--dsw-alias-label-secondary);font-size:12px}.status.success{color:var(--dsw-alias-state-success-primary)}.save{padding:7px 20px;border:1px solid transparent;border-radius:10px;background:var(--dsw-alias-label-primary);color:var(--dsw-alias-bg-base)}.cancel{padding:7px 16px;border:1px solid var(--dsw-alias-border-l2);border-radius:10px;background:transparent;color:var(--dsw-alias-label-primary)}.preview{max-width:1100px;margin:14px auto 28px;padding:0 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--dsw-alias-label-secondary);font-size:12px}.preview button{border:1px solid var(--dsw-alias-border-l1);background:transparent;color:inherit;border-radius:8px;padding:4px 10px}.preview .hint{margin-left:auto}@container(max-width:460px){.field{grid-template-columns:1fr;gap:6px}.row{grid-template-columns:16px minmax(0,1fr);gap:6px}.actions{grid-column:2;padding-top:0;justify-content:flex-end;margin-top:-8px}.add{margin-left:10px}}@media(max-width:700px){.shell{margin:0;border:0;border-radius:0;grid-template-columns:1fr;min-height:100vh}.nav{display:none}main{padding:26px 20px}.preview{margin-top:18px}.preview .hint{margin-left:0;width:100%}}
/* native-control-alignment: 原版控件截图对齐，尺寸单位为 CSS px */
main .row input:focus,main .select:focus{outline:none;outline-offset:0;box-shadow:none;border-color:var(--dsw-alias-brand-primary)}
main .select,main .row input{border-radius:10px;padding:6px 10px;min-height:32px;line-height:20px;font-size:14px}
main .field{margin-bottom:16px}main .label,main .primary{font-size:13px}
main .block{margin-top:20px;padding-top:16px}main .head{margin-bottom:14px}
main .track{display:block;flex:none;width:36px;height:20px;border:0;border-radius:999px;background:var(--dsw-alias-border-l2)}
main .track:after{width:16px;height:16px;top:2px;left:2px;background:var(--dsw-alias-label-secondary);transition:transform .15s,background .15s}
main .toggle input:checked+.track{background:var(--dsw-alias-label-primary)}
main .toggle input:checked+.track:after{transform:translateX(16px);background:var(--dsw-alias-bg-layer-2)}
main .toggle:has(input:disabled){cursor:default;opacity:.4}main .toggle input:disabled+.track{opacity:1}
main .row{gap:8px;margin-bottom:10px}main .icon{border:0;background:transparent;color:var(--dsw-alias-label-secondary);border-radius:8px}
main .footer{margin-top:20px;padding-top:16px}main .cancel,main .save{border-radius:10px;padding:6px 16px;min-height:32px}
main .save{background:var(--dsw-alias-label-primary);color:var(--dsw-alias-bg-base)}
main .row{grid-template-columns:100px minmax(0,1fr);gap:12px}main .number{font-size:13px;padding-top:7px}main .row input{padding:10px 12px;border-radius:12px} @container(max-width:460px){main .row{grid-template-columns:1fr;gap:6px}}
</style></head><body>
<div class="shell"><aside class="nav" aria-label="设置导航示意"><h2>设置</h2><div>通用</div><div>模型</div><div>插件</div><div class="selected">备用地址</div></aside><main id="settings-page"><h1>备用地址</h1><div class="field"><label class="label" for="provider">供应商</label><select class="select" id="provider"><option value="router">4Router</option><option value="example">示例供应商</option></select></div><div class="field"><span class="label">主地址</span><span class="primary" id="primary"></span></div><section class="block" id="backup-editor"><div class="head"><h2>备用地址</h2><label class="toggle">启用<input id="enabled" type="checkbox" role="switch"><span class="track" aria-hidden="true"></span></label></div><div id="rows"></div></section><footer class="footer" id="save-bar"><span class="status" id="status" role="status" aria-live="polite"></span><button class="cancel" id="cancel" type="button">取消</button><button class="save" id="save" type="button">保存</button></footer></main></div>
<div class="preview" aria-label="仅原型演示控制"><span>原型预览</span><button id="readonly" type="button">切换只读</button><button id="theme" type="button">切换浅色</button><span class="hint">仅演示，不连接 Desktop，不写入真实配置。</span></div>
<script>
const $=id=>document.getElementById(id);const seed={router:{primary:'https://4router.net/v1',enabled:true,backups:['https://hk.4router.net/v1']},example:{primary:'https://api.example.com/v1',enabled:false,backups:[]}};let stored=structuredClone(seed),draft=structuredClone(stored.router),readOnly=false,busy=false,message='',success=false;
function canonical(raw){raw=raw.trim();if(!/^https:\/\//i.test(raw))throw Error('地址必须使用 https://');let u;try{u=new URL(raw)}catch{throw Error('请输入有效的 https:// 地址')}if(u.username||u.password||raw.includes('@'))throw Error('地址不能包含账号或密码');if(raw.includes('?')||raw.includes('#'))throw Error('地址不能包含查询参数或锚点');return u.href.replace(/\/+$/,'')}
function validate(){const seen=new Set(),errors=draft.backups.map(raw=>{if(!raw.trim())return '';try{const value=canonical(raw);if(value===canonical(draft.primary))return '与主地址相同，无需填写';if(seen.has(value))return '与其他备用地址重复';seen.add(value);return ''}catch(e){return e.message}});return {errors,reason:errors.find(Boolean)||(draft.enabled&&!draft.backups.some(v=>v.trim())?'启用故障切换至少需要一条地址':'')}}
function dirty(){return JSON.stringify(draft)!==JSON.stringify(stored[$('provider').value])}function state(){const v=validate();$('save').disabled=readOnly||busy||!dirty()||!!v.reason;$('cancel').disabled=readOnly||busy||!dirty();$('enabled').disabled=readOnly||busy;$('enabled').checked=draft.enabled;$('enabled').setAttribute('aria-checked',String(draft.enabled));$('provider').disabled=busy;$('status').textContent=readOnly?'当前设置为只读':busy?'正在保存…':message||v.reason||(dirty()?'未保存':'');$('status').classList.toggle('success',success);$('save').textContent=busy?'保存中…':'保存';$('save').title=v.reason}
function render(){const v=validate();$('primary').textContent=draft.primary;$('rows').replaceChildren();[0,1].forEach(i=>{const value=draft.backups[i]||'';const row=document.createElement('div');row.className='row';const n=document.createElement('span');n.className='number';n.textContent='备线 '+(i+1);const field=document.createElement('div'),input=document.createElement('input'),err=document.createElement('p');input.value=value;input.placeholder='留空表示不使用此线路';input.setAttribute('aria-label','备用地址 '+(i+1));input.disabled=readOnly||busy;err.id='error-'+i;err.className='error';err.textContent=v.errors[i];input.setAttribute('aria-describedby',err.id);input.setAttribute('aria-invalid',String(!!v.errors[i]));input.classList.toggle('invalid',!!v.errors[i]);input.oninput=()=>{draft.backups[i]=input.value;message='';success=false;const next=validate();document.querySelectorAll('.row input').forEach((el,j)=>{el.classList.toggle('invalid',!!next.errors[j]);el.setAttribute('aria-invalid',String(!!next.errors[j]));$('error-'+j).textContent=next.errors[j]});state()};field.append(input,err);row.append(n,field);$('rows').append(row)});state()}
$('enabled').onchange=e=>{draft.enabled=e.target.checked;message='';success=false;state()};$('cancel').onclick=()=>{draft=structuredClone(stored[$('provider').value]);message='';success=false;render()};let current='router';$('provider').onchange=()=>{if(dirtyFor(current)&&!confirm('当前修改尚未保存，是否放弃？')){$('provider').value=current;return}current=$('provider').value;draft=structuredClone(stored[current]);message='';success=false;render()};function dirtyFor(id){return JSON.stringify(draft)!==JSON.stringify(stored[id])}
$('save').onclick=async()=>{if($('save').disabled)return;busy=true;render();await new Promise(r=>setTimeout(r,400));draft.backups=draft.backups.filter(v=>v.trim()).map(canonical);stored[current]=structuredClone(draft);busy=false;message='已保存';success=true;render()};$('readonly').onclick=()=>{readOnly=!readOnly;render()};let light=false;$('theme').onclick=()=>{light=!light;const styles=light?{'bg-base':'#ffffff','bg-layer-1':'#f1f2f4','bg-layer-2':'#f5f5f7','border-l1':'#0000001a','border-l2':'#00000030','label-primary':'#242427','label-secondary':'#6b6d73','brand-primary':'#3275df'}:{'bg-base':'#2c2c2e','bg-layer-1':'#353638','bg-layer-2':'#232324','border-l1':'#ffffff24','border-l2':'#ffffff33','label-primary':'#f9fafb','label-secondary':'#adb2b8','brand-primary':'#7aaaff'};Object.entries(styles).forEach(([k,v])=>document.documentElement.style.setProperty('--dsw-alias-'+k,v));document.documentElement.style.colorScheme=light?'light':'dark';document.querySelector('.nav').style.background=light?'#f7f7f8':'#28282a';$('theme').textContent=light?'切换深色':'切换浅色'};render();
</script></body></html>
